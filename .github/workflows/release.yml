name: Release

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read
  issues: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      (
        contains(github.event.pull_request.labels.*.name, 'patch') ||
        contains(github.event.pull_request.labels.*.name, 'minor') ||
        contains(github.event.pull_request.labels.*.name, 'major')
      )

    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Determine release type
        id: release-type
        env:
          PATCH: ${{ contains(github.event.pull_request.labels.*.name, 'patch') }}
          MINOR: ${{ contains(github.event.pull_request.labels.*.name, 'minor') }}
          MAJOR: ${{ contains(github.event.pull_request.labels.*.name, 'major') }}
        run: |
          count=0
          [ "$PATCH" = "true" ] && bump="patch" && count=$((count + 1))
          [ "$MINOR" = "true" ] && bump="minor" && count=$((count + 1))
          [ "$MAJOR" = "true" ] && bump="major" && count=$((count + 1))

          if [ "$count" -ne 1 ]; then
            echo "Exactly one release label is required."
            exit 1
          fi

          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Bump package version
        id: version
        run: |
          npm version ${{ steps.release-type.outputs.bump }} --no-git-tag-version
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Commit release version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git tag v${{ steps.version.outputs.version }}
          git push origin main
          git push origin v${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "Released from PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"

      - name: Trigger Production Deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/dispatches" \
            --method POST \
            --field event_type=production_deploy \
            --raw-field client_payload='{"tag":"${{ steps.version.outputs.tag }}"}'

      - name: Mark Pull Request as Released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" \
            --add-label released
